<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 360" role="img" aria-labelledby="title">
  <title id="title">Max Station USB ADB wiring</title>
  <rect width="770" height="360" rx="20" fill="#111827"/>
  <g fill="#f8fafc" font-family="sans-serif">
    <text x="35" y="45" font-size="23" font-weight="700">YNDX-0008 · USB ADB</text>
    <text x="35" y="90" font-size="16">AUX side</text>
    <text x="365" y="90" font-size="16">RJ45</text>
    <text x="610" y="90" font-size="16">Power jack side</text>
    <text x="35" y="240" font-size="16">USB-A host</text>
    <text x="605" y="287" font-size="15">1 · +5 V · isolate</text>
    <text x="35" y="332" font-size="14" fill="#cbd5e1">Orientation follows the labeled reference photo. USB-A contact numbers are electrical labels.</text>
  </g>
  <g fill="#25334a" stroke="#91a4bd" stroke-width="1">
    <rect x="195" y="107" width="58" height="43" rx="6"/><rect x="257" y="107" width="58" height="43" rx="6"/>
    <rect x="319" y="107" width="58" height="43" rx="6"/><rect x="381" y="107" width="58" height="43" rx="6"/>
    <rect x="443" y="107" width="58" height="43" rx="6"/><rect x="505" y="107" width="58" height="43" rx="6"/>
    <rect x="567" y="107" width="58" height="43" rx="6"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#f8fafc" font-size="14">
    <text x="224" y="133">1 D+</text><text x="286" y="133">2 D−</text><text x="348" y="133">3 GND</text>
    <text x="410" y="133">4 TX</text><text x="472" y="133">5 RX</text><text x="534" y="133">6 Boot</text><text x="596" y="133">7 NC</text>
    <text x="224" y="273">3 D+</text><text x="286" y="273">2 D−</text><text x="348" y="273">4 GND</text>
  </g>
  <g fill="none" stroke-width="4" stroke-linecap="round">
